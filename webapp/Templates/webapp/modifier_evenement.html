{% extends 'webapp/base.html' %}
{% block title %}Modifier l'événement{% endblock %}
{% block header %}
<header>
    <h1>Modifier l'événement : {{ event.titre }}</h1>
    <nav>
        <ul style="list-style:none; margin:0; padding:0; display:flex; justify-content:center; gap:18px;">
            <li><a href="{% url 'evenement_detail' event.id %}">Retour au détail</a></li>
        </ul>
    </nav>
</header>
{% endblock %}
{% block content %}
<div class="container">
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Enregistrer les modifications</button>
    </form>
</div>
{% endblock %}
