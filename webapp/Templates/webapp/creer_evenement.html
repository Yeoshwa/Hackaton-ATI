{% extends 'webapp/base.html' %}
{% block title %}Créer un événement{% endblock %}
{% block header %}
<header>
    <h1>Créer un événement</h1>
    <nav>
        <ul style="list-style:none; margin:0; padding:0; display:flex; justify-content:center; gap:18px;">
            <li><a href="{% url 'evenements' %}">Retour à la liste</a></li>
        </ul>
    </nav>
</header>
{% endblock %}
{% block content %}
<div class="container">
    {% if success %}
        <div class="success-message">Événement créé avec succès !</div>
    {% endif %}
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Créer l'événement</button>
    </form>
</div>
{% endblock %}
