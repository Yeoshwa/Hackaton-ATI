{% extends 'webapp/base.html' %}
{% block title %}Supprimer l'événement{% endblock %}
{% block header %}
<header>
    <h1>Supprimer l'événement : {{ event.titre }}</h1>
    <nav>
        <ul style="list-style:none; margin:0; padding:0; display:flex; justify-content:center; gap:18px;">
            <li><a href="{% url 'evenement_detail' event.id %}">Annuler</a></li>
        </ul>
    </nav>
</header>
{% endblock %}
{% block content %}
<div class="container">
    <form method="post">
        {% csrf_token %}
        <p>Êtes-vous sûr de vouloir supprimer cet événement ?</p>
        <button type="submit" class="btn btn-danger">Supprimer</button>
    </form>
</div>
{% endblock %}
