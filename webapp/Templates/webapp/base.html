<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %} Titre par defaut {% endblock %}</title>
    <link href="https://fonts.googleapis.com/css?family=Montserrat:400,700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #219150;
            --text: #222;
            --bg: #fff;
            --border: #e0e0e0;
            --danger: #dc3545;
            --warning: #ffc107;
            --success: #28a745;
        }
        html, body {
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }
        nav, header nav {
            background: none;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            border-bottom: 1px solid var(--border);
        }
        nav a, header nav ul li a {
            color: var(--primary);
            text-decoration: none;
            margin: 0 10px;
            font-weight: 500;
            padding: 10px 0;
            border-bottom: 2px solid transparent;
            transition: border 0.2s;
        }
        nav a:hover, header nav ul li a:hover {
            border-bottom: 2px solid var(--primary);
        }
        header {
            background: none;
            padding: 24px 0 0 0;
            text-align: center;
        }
        header h1 {
            margin: 0 0 10px 0;
            color: var(--primary);
            font-size: 2em;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        main, .container {
            max-width: 700px;
            margin: 24px auto;
            background: var(--bg);
            border-radius: 8px;
            border: 1px solid var(--border);
            padding: 24px 16px;
        }
        h2 {
            color: var(--primary);
            margin-top: 0;
            font-size: 1.3em;
        }
        ul {
            padding-left: 18px;
        }
        .btn {
            display: inline-block;
            margin: 4px 4px 4px 0;
            padding: 7px 16px;
            border-radius: 4px;
            font-weight: 500;
            text-decoration: none;
            border: 1px solid var(--primary);
            background: none;
            color: var(--primary);
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
        }
        .btn-success { border-color: var(--success); color: var(--success);}
        .btn-warning { border-color: var(--warning); color: var(--warning);}
        .btn-danger { border-color: var(--danger); color: var(--danger);}
        .btn:hover {
            background: var(--primary);
            color: #fff;
        }
        .btn-success:hover { background: var(--success); color: #fff;}
        .btn-warning:hover { background: var(--warning); color: #222;}
        .btn-danger:hover { background: var(--danger); color: #fff;}
        form {
            margin: 18px 0;
        }
        input, select, textarea, button {
            font-family: inherit;
            font-size: 1em;
        }
        input[type="text"], input[type="email"], input[type="password"], textarea, select {
            width: 100%;
            padding: 7px 9px;
            margin: 7px 0 14px 0;
            border: 1px solid var(--border);
            border-radius: 4px;
            background: #fafafa;
            box-sizing: border-box;
        }
        button[type="submit"], input[type="submit"] {
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 9px 20px;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s;
        }
        button[type="submit"]:hover, input[type="submit"]:hover {
            background: #176c38;
        }
        .user-card, .event-card {
            display: flex;
            align-items: center;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: #fafafa;
            margin-bottom: 10px;
        }
        .user-img img, .event-img img {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            margin-right: 14px;
            object-fit: cover;
            background: #e0e0e0;
        }
        .user-info h3, .event-info h3 {
            margin: 0;
            font-size: 1em;
            color: var(--primary);
        }
        .user-info p, .event-info p {
            margin: 2px 0;
        }
        .success-message {
            color: var(--success);
            font-weight: 500;
            margin-bottom: 12px;
        }
        .danger-message {
            color: var(--danger);
            font-weight: 500;
            margin-bottom: 12px;
        }
        footer {
            background: none;
            text-align: center;
            padding: 16px 0 8px 0;
            margin-top: 32px;
            border-top: 1px solid var(--border);
            color: #888;
            font-size: 0.98em;
        }
        @media (max-width: 700px) {
            main, .container {
                padding: 8px 2vw;
            }
            .user-card, .event-card {
                flex-direction: column;
                align-items: flex-start;
            }
            nav, header nav {
                flex-direction: column;
                gap: 6px;
            }
        }
    </style>
</head>
<body>
    {% block header %}
    {% endblock %}
    <main>
        {% block content %}
        {% endblock %}
    </main>
    <footer>
        <p>&copy; 2023 Clean-CITY</p>
    </footer>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</body>
</html>
